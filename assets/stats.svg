<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Repo stats: 226 SQL solutions, 176 pandas notebooks, 13 topics, 387 commits; 102 easy, 208 medium, 64 hard">
  <!-- ponytail: numbers are static (counted 2026-11-27 via git ls-files); re-count and edit when they drift -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="1" stop-color="#0b0726"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b2a55"/>
    </pattern>
  </defs>

  <rect width="1200" height="250" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="250" rx="16" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="248" rx="16" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="2"/>

  <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace">
    <text x="32" y="36" font-size="12" letter-spacing="3" fill="#5fd8ff">◈ TELEMETRY // REPO_STATS</text>
    <text x="1168" y="36" font-size="12" letter-spacing="3" fill="#39ff9c" text-anchor="end">● LIVE FEED</text>
  </g>

  <!-- 4 tiles -->
  <g font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="32" y="54" width="263" height="104" rx="10" fill="#00f0ff" fill-opacity="0.05" stroke="#00f0ff" stroke-opacity="0.45"/>
      <text x="163" y="114" font-size="46" font-weight="700" fill="#00f0ff" filter="url(#glow)">226</text>
      <text x="163" y="142" font-size="13" letter-spacing="4" fill="#9fdcff" font-family="Consolas, monospace">SQL SOLUTIONS</text>
    </g>
    <g>
      <rect x="317" y="54" width="263" height="104" rx="10" fill="#8a5cff" fill-opacity="0.07" stroke="#8a5cff" stroke-opacity="0.6"/>
      <text x="448" y="114" font-size="46" font-weight="700" fill="#b48cff" filter="url(#glow)">176</text>
      <text x="448" y="142" font-size="13" letter-spacing="4" fill="#cdb8ff" font-family="Consolas, monospace">PANDAS NOTEBOOKS</text>
    </g>
    <g>
      <rect x="602" y="54" width="263" height="104" rx="10" fill="#ff2bd6" fill-opacity="0.06" stroke="#ff2bd6" stroke-opacity="0.55"/>
      <text x="733" y="114" font-size="46" font-weight="700" fill="#ff5fe0" filter="url(#glow)">13</text>
      <text x="733" y="142" font-size="13" letter-spacing="4" fill="#ffb8f1" font-family="Consolas, monospace">SQL TOPICS</text>
    </g>
    <g>
      <rect x="887" y="54" width="281" height="104" rx="10" fill="#39ff9c" fill-opacity="0.05" stroke="#39ff9c" stroke-opacity="0.5"/>
      <text x="1027" y="114" font-size="46" font-weight="700" fill="#39ff9c" filter="url(#glow)">387+</text>
      <text x="1027" y="142" font-size="13" letter-spacing="4" fill="#b6ffd9" font-family="Consolas, monospace">COMMITS SINCE DEC '25</text>
    </g>
  </g>

  <!-- difficulty split: 102 easy / 208 medium / 64 hard = 374 -> 27.3% / 55.6% / 17.1% of 1136px -->
  <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="12" letter-spacing="2">
    <text x="32" y="190" fill="#5fd8ff">DIFFICULTY_SPLIT</text>
    <rect x="32" y="200" width="1136" height="14" rx="7" fill="#11173a"/>
    <rect x="32" y="200" height="14" rx="7" width="0" fill="#39ff9c" filter="url(#glow)">
      <animate attributeName="width" from="0" to="310" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <rect x="346" y="200" height="14" rx="7" width="0" fill="#ffb800" filter="url(#glow)">
      <animate attributeName="width" from="0" to="628" dur="1.4s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <rect x="978" y="200" height="14" rx="7" width="0" fill="#ff2b6a" filter="url(#glow)">
      <animate attributeName="width" from="0" to="190" dur="1.2s" begin="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <text x="32" y="236" fill="#39ff9c">EASY 102</text>
    <text x="600" y="236" fill="#ffb800" text-anchor="middle">MEDIUM 208</text>
    <text x="1168" y="236" fill="#ff2b6a" text-anchor="end">HARD 64</text>
  </g>
</svg>
