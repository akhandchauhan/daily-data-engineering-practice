<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Daily Data Engineering Practice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.62" stop-color="#070b26"/>
      <stop offset="1" stop-color="#12052a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="250" width="1200" height="110" fill="url(#gridFade)"/></mask>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <!-- typed terminal lines: each reveals, holds, clears in turn (12s loop) -->
    <clipPath id="t1"><rect x="330" y="176" height="30" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;540;540;0;0" keyTimes="0;0.12;0.30;0.33;1"/></rect></clipPath>
    <clipPath id="t2"><rect x="330" y="176" height="30" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;540;540;0;0" keyTimes="0;0.33;0.45;0.63;0.66;1"/></rect></clipPath>
    <clipPath id="t3"><rect x="330" y="176" height="30" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;540;540;0;0" keyTimes="0;0.66;0.78;0.96;0.99;1"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- star dust -->
    <g fill="#9fe9ff">
      <circle cx="90" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="130" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="40" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="70" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="55" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="210" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="215" r="1"><animate attributeName="opacity" values="1;0.4;1" dur="3.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- horizon glow + line -->
    <rect x="0" y="250" width="1200" height="110" fill="url(#horizonGlow)"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#ff2bd6" stroke-width="1.5" filter="url(#softGlow)" opacity="0.9"/>

    <!-- perspective grid -->
    <g mask="url(#gridMask)" stroke="#8a5cff" stroke-width="1.2" opacity="0.85">
      <g id="verticals">
        <line x1="600" y1="250" x2="600" y2="360"/>
        <line x1="612" y1="250" x2="760" y2="360"/><line x1="588" y1="250" x2="440" y2="360"/>
        <line x1="624" y1="250" x2="920" y2="360"/><line x1="576" y1="250" x2="280" y2="360"/>
        <line x1="636" y1="250" x2="1080" y2="360"/><line x1="564" y1="250" x2="120" y2="360"/>
        <line x1="648" y1="250" x2="1240" y2="360"/><line x1="552" y1="250" x2="-40" y2="360"/>
        <line x1="660" y1="250" x2="1400" y2="360"/><line x1="540" y1="250" x2="-200" y2="360"/>
        <line x1="672" y1="250" x2="1560" y2="360"/><line x1="528" y1="250" x2="-360" y2="360"/>
      </g>
      <!-- horizontal lines rush toward the viewer (ease-in = perspective acceleration) -->
      <g>
        <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
        <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
        <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
        <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
        <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
        <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
      </g>
    </g>

    <!-- HUD corners -->
    <g fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8">
      <path d="M24 56 V24 H56"/><path d="M1144 24 H1176 V56"/>
      <path d="M24 304 V336 H56"/><path d="M1176 304 V336 H1144"/>
    </g>
    <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#5fd8ff" opacity="0.85">
      <text x="68" y="40">SYS://DATA_ENGG ▸ NODE_01</text>
      <text x="1132" y="40" text-anchor="end" fill="#39ff9c">ONLINE</text>
      <text x="68" y="330">SQL · PANDAS · PYSPARK</text>
      <text x="1132" y="330" text-anchor="end">BUILD 2026.11</text>
    </g>
    <circle cx="1060" cy="36" r="4" fill="#39ff9c" filter="url(#softGlow)"><animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/></circle>

    <!-- title with glitch split -->
    <g font-family="Bahnschrift, 'DIN Alternate', 'Arial Narrow', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="58" text-anchor="middle" letter-spacing="3">
      <text x="600" y="128" fill="#ff2bd6" opacity="0.7" textLength="1000" lengthAdjust="spacingAndGlyphs">DAILY DATA ENGINEERING PRACTICE
        <animate attributeName="x" values="600;600;606;596;600;600" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
      <text x="600" y="128" fill="#00f0ff" opacity="0.7" textLength="1000" lengthAdjust="spacingAndGlyphs">DAILY DATA ENGINEERING PRACTICE
        <animate attributeName="x" values="600;600;594;604;600;600" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
      <text x="600" y="128" fill="url(#title)" filter="url(#glow)" textLength="1000" lengthAdjust="spacingAndGlyphs">DAILY DATA ENGINEERING PRACTICE</text>
      <rect x="100" y="146" width="1000" height="1" fill="url(#title)" opacity="0.5"/>
    </g>

    <!-- terminal line -->
    <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="19" fill="#c9f6ff" filter="url(#softGlow)">
      <text x="300" y="197" fill="#ff2bd6">&gt;</text>
      <text x="330" y="197" clip-path="url(#t1)" textLength="540" lengthAdjust="spacingAndGlyphs">226 SQL solutions · 176 pandas notebooks</text>
      <text x="330" y="197" clip-path="url(#t2)" textLength="540" lengthAdjust="spacingAndGlyphs">window fns · recursive CTEs · every JOIN type</text>
      <text x="330" y="197" clip-path="url(#t3)" textLength="540" lengthAdjust="spacingAndGlyphs">easy → medium → hard · shipped daily</text>
      <rect y="181" width="11" height="20" fill="#00f0ff">
        <animate attributeName="x" dur="12s" repeatCount="indefinite" values="332;874;874;332;332;874;874;332;332;874;874;332" keyTimes="0;0.12;0.30;0.33;0.33;0.45;0.63;0.66;0.66;0.78;0.96;1"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </g>

    <!-- problem sources -->
    <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="12" letter-spacing="2" text-anchor="middle">
      <rect x="270" y="219" width="170" height="22" rx="4" fill="#ffb800" fill-opacity="0.08" stroke="#ffb800" stroke-opacity="0.6"/>
      <text x="355" y="234" fill="#ffcf4d">LEETCODE PREMIUM</text>
      <rect x="456" y="219" width="130" height="22" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.6"/>
      <text x="521" y="234" fill="#7ff6ff">DATALEMUR</text>
      <rect x="602" y="219" width="160" height="22" rx="4" fill="#8a5cff" fill-opacity="0.1" stroke="#8a5cff" stroke-opacity="0.7"/>
      <text x="682" y="234" fill="#c4a8ff">STRATASCRATCH</text>
      <rect x="778" y="219" width="150" height="22" rx="4" fill="#ff2bd6" fill-opacity="0.08" stroke="#ff2bd6" stroke-opacity="0.6"/>
      <text x="853" y="234" fill="#ff8ae8">ANKIT BANSAL</text>
    </g>

    <!-- scanline sweep -->
    <rect x="0" y="-8" width="1200" height="6" fill="#00f0ff" opacity="0.07">
      <animate attributeName="y" values="-8;368" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="360" rx="18" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
